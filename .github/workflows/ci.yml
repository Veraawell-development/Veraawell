# The checks CONTRIBUTING.md asks every change to pass. Until this existed,
# "the build fails" meant "if someone remembered to run it locally".
#
# Render does not auto-deploy (render.yaml autoDeploy: false), so a green run
# here is the signal to deploy the server by hand; Vercel deploys the client
# from main on its own.
name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  server:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: server/package-lock.json
      - run: npm ci
      # The UTC run, plus the per-file coverage ratchet.
      - run: npm run test:coverage
      # The same suite under a zone with DST and a negative offset: the time
      # bugs here only show up for some users at some hours.
      - run: npm run test:tz

  client:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: client/package-lock.json
      - run: npm ci
      - run: npx tsc -b
      - run: npm run build
      - run: npm run test:unit
