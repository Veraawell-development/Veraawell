# Render Blueprint for Veraawell Backend
# Infrastructure definition for the backend API.
#
# Rules for this file:
#   1. NEVER put a secret, credential, or account identifier here — this file
#      is committed. Anything sensitive is `sync: false` and lives only in the
#      Render dashboard. (FRONTEND_URL and ADMIN_ID were previously hardcoded
#      here; ADMIN_ID is half of the super-admin master login credential.)
#   2. Every variable the server actually reads must be listed, even if
#      `sync: false`, so a fresh environment cannot be provisioned with a
#      silently missing key. config/environment.js validateEnvironment()
#      enforces the required subset at boot.

services:
  # Web Service - Backend API
  - type: web
    name: veraawell-backend
    runtime: node
    region: oregon
    # Standard (1 CPU, 2 GB): never sleeps. Free spun down after ~15 min idle
    # — 30–60 s before the first call could start, every live call room lost,
    # and the node-cron jobs (reminders, refund sweeps) stopped.
    plan: standard
    # `npm ci` installs exactly what package-lock.json pins. `npm install` can
    # silently resolve different versions than were tested.
    buildCommand: npm ci
    startCommand: npm start
    rootDir: server

    healthCheckPath: /api/health

    envVars:
      - key: NODE_ENV
        value: production

      # ── Required in production (validateEnvironment exits without these) ──
      - key: MONGO_URI
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: SESSION_SECRET
        sync: false # Must be stable: it encrypts session payloads. A missing
                    # or rotating value logs every user out on each restart.
      - key: ADMIN_JWT_SECRET
        sync: false
      - key: FRONTEND_URL
        sync: false # Set to the real frontend origin. Must agree with the auth
                    # cookie domain in config/auth.js or cookies are never sent.

      # Payments — the SDK cannot be constructed without the key pair, and
      # webhook signature verification cannot run without the webhook secret.
      - key: RAZORPAY_KEY_ID
        sync: false
      - key: RAZORPAY_KEY_SECRET
        sync: false
      - key: RAZORPAY_WEBHOOK_SECRET
        sync: false

      # Media uploads (profile images, doctor verification documents)
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false

      # Transactional email (password reset, OTP, booking confirmations)
      - key: RESEND
        sync: false

      # ── Optional: feature degrades without these, app still boots ──
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      # TURN relay for calls (Cloudflare Realtime → TURN key). Without it,
      # calls on Jio/Airtel data, office Wi-Fi and many routers cannot
      # connect; the call screen and the error log say so
      # (services/turnCredentials.js).
      - key: CLOUDFLARE_TURN_KEY_ID
        sync: false
      - key: CLOUDFLARE_TURN_API_TOKEN
        sync: false
      # Optional static relay used only if Cloudflare is down
      # (comma-separated turn:/turns: URLs + one username/credential).
      - key: TURN_FALLBACK_URLS
        sync: false
      - key: TURN_FALLBACK_USERNAME
        sync: false
      - key: TURN_FALLBACK_CREDENTIAL
        sync: false
      # Call engine switch: unset/v2 = new engine (old open tabs still
      # served); v1 = roll back to the old engine.
      - key: CALL_ENGINE
        sync: false
      # LiveKit Cloud project (video/voice calls). All three, or none: without
      # them every call stays on the legacy stack. See config/features.js.
      - key: LIVEKIT_URL
        sync: false
      - key: LIVEKIT_API_KEY
        sync: false
      - key: LIVEKIT_API_SECRET
        sync: false
      # Rollback switches (config/features.js). Leave unset for the defaults;
      # set SESSION_RULES=v1 or VIDEO_PROVIDER=legacy to undo a rollout.
      - key: SESSION_RULES
        sync: false
      - key: VIDEO_PROVIDER
        sync: false
      # Super-admin master login. Both halves are credentials — neither may be
      # a literal in this file.
      - key: ADMIN_ID
        sync: false
      - key: ADMIN_PASSWORD
        sync: false

      # ── Read by the code but previously absent from this file ──
      #
      # Listed per the rule at the top: a variable the server reads and this
      # file omits is one a fresh environment can be provisioned without, and
      # nothing will say so. Each of these fails quietly rather than loudly.

      # The floor for payout generation — nothing dated before it is ever
      # claimed (services/payoutLedger.js). It DEFAULTS to 2026-09-01, so
      # leaving it unset is not neutral: the first weekly run sweeps every
      # delivered session back to that date. Set it to the date you actually
      # intend to start paying from.
      - key: PAYOUT_EPOCH
        sync: false

      # Leave UNSET. 'stub' fabricates payments; anything else is live, which
      # is the default. validateEnvironment() refuses to boot production with
      # 'stub' (config/payments.js assertPaymentsConfigured).
      - key: PAYMENTS_MODE
        sync: false

      # One-time bootstrap for POST /api/admin/auth/setup. Both are required
      # for setup to run.
      - key: INITIAL_ADMIN_EMAIL
        sync: false
      - key: INITIAL_ADMIN_PASSWORD
        sync: false

      # Dev-only knobs; production pins the level to 'info' regardless.
      - key: LOG_LEVEL
        sync: false
      - key: LOG_VERBOSE
        sync: false

    # Disabled deliberately. There is no CI in this repo yet, so autoDeploy
    # ships whatever lands on main straight to production with nothing having
    # run the test suite or a boot check. Re-enable once the GitHub Actions
    # workflow gates merges.
    autoDeploy: false

    # Must stay 1 until the per-process state is externalised: Socket.IO room
    # maps (no Redis adapter), the express-rate-limit MemoryStore, node-cache,
    # and four node-cron jobs whose overlap guards are in-process. With two
    # instances, video calls break across instances and reminder emails and
    # refund sweeps run twice.
    numInstances: 1
    # A deploy keeps the old instance running while the new one starts. Give
    # it time to tell open calls "server restarting" and save who is present
    # (server.js gracefulShutdown) before it is stopped.
    maxShutdownDelaySeconds: 60
